name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ and pubspec.yaml; generate the Android
      # project files in CI, then restore our own two files.
      - name: Generate Android scaffolding
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name keep_canvas .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          # ML Kit needs a higher minSdk than some Flutter defaults
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true
          # ask Google Play services to fetch the subject-segmentation model
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'subject_segment' not in s:
              s = s.replace('</application>', '    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="subject_segment"/>\n    </application>', 1)
          if 'android.intent.action.VIEW' not in s:
              s = s.replace('<application', '<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent></queries>\n    <application', 1)
          open(p, 'w').write(s)
          PY

      - name: Fetch fonts (Google Sans Flex, Instrument Serif)
        run: |
          mkdir -p assets/fonts
          get() { curl -fsSL "$1" -o "assets/fonts/$2" && echo "got $2" || { rm -f "assets/fonts/$2"; echo "MISSING $2"; }; }
          B=https://raw.githubusercontent.com/google/fonts/main/ofl
          get "$B/instrumentserif/InstrumentSerif-Regular.ttf" InstrumentSerif-Regular.ttf
          get "$B/instrumentserif/InstrumentSerif-Italic.ttf" InstrumentSerif-Italic.ttf
          get "$B/googlesansflex/GoogleSansFlex%5BROND%2Copsz%2Cslnt%2Cwdth%2Cwght%5D.ttf" GoogleSansFlex.ttf
          python3 - << 'PY'
          import os
          s = open('pubspec.yaml').read()
          fam = []
          if os.path.exists('assets/fonts/GoogleSansFlex.ttf'):
              fam.append('    - family: GoogleSansFlex\n      fonts:\n        - asset: assets/fonts/GoogleSansFlex.ttf\n')
          sf = [f for f in ('Regular', 'Italic') if os.path.exists('assets/fonts/InstrumentSerif-%s.ttf' % f)]
          if sf:
              body = ''.join('        - asset: assets/fonts/InstrumentSerif-%s.ttf\n%s' % (f, '          style: italic\n' if f == 'Italic' else '') for f in sf)
              fam.append('    - family: InstrumentSerif\n      fonts:\n' + body)
          if fam and 'fonts:' not in s.split('flutter:')[-1]:
              s = s.rstrip('\n') + '\n  fonts:\n' + ''.join(fam)
          open('pubspec.yaml', 'w').write(s)
          PY

      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: keep-canvas-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
